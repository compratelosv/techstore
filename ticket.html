<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket · TechStore SV</title>
<style>
  @page { size: 80mm auto; margin: 3mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: #e9edf5;
    font-family: ui-monospace, "Courier New", monospace; color: #111;
  }
  .ticket {
    width: 80mm; margin: 0 auto; background: #fff; padding: 8px 7px 12px;
    box-shadow: 0 8px 24px -14px rgba(0,0,0,.45);
  }
  .c { text-align: center; }
  .b { font-weight: 700; }
  .s { font-size: 10px; }
  .xs { font-size: 9px; line-height: 1.35; }
  hr { border: 0; border-top: 1px dashed #999; margin: 6px 0; }
  .row { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; }
  .row span:last-child { text-align: right; white-space: nowrap; }
  .line { font-size: 11px; margin: 2px 0; }
  .line .qty { display: inline-block; min-width: 26px; }
  .line .amt { float: right; font-weight: 700; }
  .tot { font-size: 13px; font-weight: 700; }
  .warn {
    border: 1.5px solid #111; padding: 4px 5px; margin: 6px 0;
    font-size: 9px; font-weight: 700; text-align: center; line-height: 1.25;
  }
  .mono-sm { font-size: 9px; word-break: break-all; }
  .no-print { max-width: 80mm; margin: 10px auto 0; display: flex; gap: 6px; }
  .no-print button {
    flex: 1; padding: 10px; border-radius: 8px; border: 0; font-weight: 700;
    font-family: system-ui, sans-serif; background: #4f46e5; color: #fff; cursor: pointer;
  }
  .no-print button.alt { background: #fff; color: #333; border: 1px solid #cbd5e1; }
  @media print {
    body { background: #fff; padding: 0; }
    .ticket { box-shadow: none; width: auto; padding: 0; }
    .no-print { display: none; }
  }
</style>
</head>
<body>

<div class="ticket" id="ticket"><p class="s c">Cargando…</p></div>

<div class="no-print">
  <button onclick="window.print()">Imprimir</button>
  <button class="alt" onclick="window.close()">Cerrar</button>
</div>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/ticket.js?v=01b3eeff"></script>
</body>
</html>
