<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requisición · TechStore SV</title>
<link rel="stylesheet" href="css/tienda.css?v=1">
<style>
  body{background:#eef1f6;color:#0f172a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;padding:24px}
  .doc{background:#fff;max-width:820px;margin:0 auto;padding:36px 40px;border-radius:10px;box-shadow:0 10px 30px -18px rgba(15,23,42,.35)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;border-bottom:2px solid #0f172a;padding-bottom:14px}
  .head h1{margin:0;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase}
  .head .folio{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;font-weight:800}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin:16px 0 18px;font-size:.86rem}
  .meta b{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:#64748b}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{padding:7px 6px;border-bottom:1px solid #e2e8f0;text-align:left}
  th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:#64748b}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .totales{margin-left:auto;width:300px;margin-top:12px;font-size:.9rem}
  .totales div{display:flex;justify-content:space-between;padding:4px 0}
  .totales .grand{border-top:2px solid #0f172a;margin-top:6px;padding-top:8px;font-weight:800;font-size:1.02rem}
  .estado{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:#eef2f9}
  .firmas{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:46px}
  .firma{border-top:1px solid #0f172a;padding-top:6px;font-size:.78rem}
  .firma b{display:block}
  .small{font-size:.76rem;color:#64748b}
  .sello{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;color:#64748b;word-break:break-all}
  @media print{body{background:#fff;padding:0}.doc{box-shadow:none;border-radius:0;max-width:none;padding:24mm 18mm}.no-print{display:none}}
</style>
</head>
<body>

<div class="doc" id="doc">
  <p class="small">Cargando requisición…</p>
</div>

<div class="no-print" style="max-width:820px;margin:16px auto 0;display:flex;gap:.5rem;justify-content:flex-end">
  <button onclick="window.print()" style="padding:.6rem 1rem;border-radius:9px;border:0;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer">Imprimir / PDF</button>
  <button onclick="window.close()" style="padding:.6rem 1rem;border-radius:9px;border:1px solid #cbd5e1;background:#fff;cursor:pointer">Cerrar</button>
</div>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/req-print.js?v=e0ed479f"></script>
</body>
</html>
