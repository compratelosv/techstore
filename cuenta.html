<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta · TechStore SV</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/tienda.css?v=28b83818">
</head>
<body>
<header data-header></header>

<main class="wrap" style="max-width:820px">
  <!-- sin sesión -->
  <section id="authView" hidden style="padding:2rem 0 3rem">
    <div class="panel" style="max-width:460px;margin:0 auto">
      <h2 id="authTitle">Ingresar</h2>
      <form id="authForm">
        <div class="field" id="nameField" hidden>
          <label for="aName">Nombre completo</label>
          <input id="aName" autocomplete="name">
        </div>
        <div class="field">
          <label for="aEmail">Correo</label>
          <input id="aEmail" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="aPass">Contraseña</label>
          <input id="aPass" type="password" required minlength="8" autocomplete="current-password">
          <span class="hint">Mínimo 8 caracteres.</span>
        </div>
        <button class="btn primary block" id="authSubmit" type="submit">Ingresar</button>
      </form>
      <p class="small center muted" style="margin:.9rem 0 0">
        <span id="switchText">¿No tienes cuenta?</span>
        <a href="#" id="switchMode"><b>Crear cuenta</b></a>
      </p>
    </div>
  </section>

  <!-- con sesión -->
  <section id="accountView" hidden style="padding:2rem 0 3rem">
    <div class="section-head">
      <div>
        <h1 style="margin-bottom:.2rem">Mi cuenta</h1>
        <p class="muted small" id="whoami"></p>
      </div>
      <button class="btn ghost" id="logoutBtn">Cerrar sesión</button>
    </div>

    <h2 style="font-size:1.25rem;margin-top:2rem">Mis pedidos</h2>
    <div id="ordersList"></div>
    <p class="empty" id="ordersEmpty" hidden>Aún no tienes pedidos. <a href="index.html#catalogo">Ver catálogo</a></p>

    <h2 style="font-size:1.25rem;margin-top:2.5rem">Mis datos</h2>
    <form class="panel" id="profileForm" style="max-width:460px">
      <div class="field">
        <label for="pName">Nombre</label>
        <input id="pName" autocomplete="name">
      </div>
      <div class="field">
        <label for="pPhone">Teléfono de WhatsApp</label>
        <input id="pPhone" inputmode="tel" autocomplete="tel" placeholder="7000 0000">
        <span class="hint" id="phoneStatus">—</span>
      </div>
      <button class="btn primary" type="submit">Guardar datos</button>
    </form>

    <h2 id="whatsapp" style="font-size:1.25rem;margin-top:2rem">Verificar WhatsApp</h2>
    <div class="panel" style="max-width:460px">
      <p class="small muted" style="margin-top:0">
        Necesario para comprar: por ahí te avisamos del día de entrega. Escribe tu número, pide el código y confírmalo.
      </p>
      <div class="field">
        <label for="vPhone">Número (8 dígitos)</label>
        <input id="vPhone" inputmode="tel" placeholder="7123 4567">
      </div>
      <button class="btn" id="vSend" type="button" style="width:100%">Enviar código</button>
      <div id="vCodeBox" hidden style="margin-top:.8rem">
        <div class="field">
          <label for="vCode">Código de 6 dígitos</label>
          <input id="vCode" inputmode="numeric" maxlength="6" placeholder="000000">
          <span class="hint" id="vMode"></span>
        </div>
        <button class="btn primary" id="vConfirm" type="button" style="width:100%">Confirmar código</button>
      </div>
    </div>
  </section>
</main>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/account.js?v=a20f1dfd"></script>
</body>
</html>
