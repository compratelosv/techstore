<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotización · TechStore</title>
<link rel="stylesheet" href="css/admin.css?v=e0e305a8">
<style>
  body{background:#e5e7eb;color:#000}
  .doc{background:#fff;max-width:760px;margin:1.5rem auto;padding:28px 32px;border-radius:6px;box-shadow:0 10px 30px -14px rgba(0,0,0,.4)}
  .doc h1{font:800 22px/1.2 system-ui;margin:0}
  .doc .muted{color:#666}
  .doc-head{display:flex;justify-content:space-between;gap:1rem;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:16px}
  .doc-meta{font:600 12px/1.6 system-ui;text-align:right}
  .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;font:400 12px/1.6 system-ui}
  .doc-grid b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#777;margin-bottom:2px}
  table{width:100%;border-collapse:collapse;font:400 12px/1.5 system-ui}
  th{text-align:left;border-bottom:1px solid #ccc;padding:6px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#666}
  td{padding:6px 4px;border-bottom:1px solid #eee}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .totals{margin-top:12px;margin-left:auto;width:260px;font:400 12px/1.8 system-ui}
  .totals div{display:flex;justify-content:space-between}
  .totals .grand{border-top:2px solid #111;margin-top:6px;padding-top:6px;font-weight:800;font-size:14px}
  .notes{margin-top:18px;font:400 11px/1.6 system-ui;color:#444;border-top:1px dashed #ccc;padding-top:10px}
  .bar{display:flex;gap:.5rem;justify-content:center;margin:1rem 0 2rem}
  @media print{
    body{background:#fff}
    .bar{display:none !important}
    .doc{box-shadow:none;margin:0;max-width:none;padding:0}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<div id="docHost"><p style="text-align:center;padding:2rem;color:#666">Cargando cotización…</p></div>
<div class="bar">
  <button class="btn primary" id="printBtn">Imprimir / Guardar PDF</button>
  <a class="btn" href="admin.html#cotizaciones">Volver al panel</a>
</div>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/quote-print.js?v=04bb4583"></script>
</body>
</html>
